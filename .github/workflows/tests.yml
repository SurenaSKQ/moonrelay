# Moonrelay CI
#
# Runs on push and PR to the active branches, plus manual dispatch.
# Per AGENTS.md there is no CI today; this is the entry point. Flutter
# 3.24.x matches the SDK constraint (>=3.2.6 <4.0.0) and is pinned to
# keep builds reproducible until the project bumps its SDK floor.
#
# Jobs:
#   - analyze    : static analysis (cheapest blocker, parallel per OS)
#   - unit       : pure-Dart + widget tests
#   - integration: E2E with the mock Matrix HTTP client
#   - build-linux: produces a release linux bundle smoke check
#   - build-windows: produces a release windows bundle smoke check

name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'
  RUST_TOOLCHAIN_PROFILE: minimal

jobs:
  # ── Static analysis (fast, runs on every push) ────────────────────
  analyze:
    name: analyze-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: ${{ env.RUST_TOOLCHAIN_PROFILE }}
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            ~/.gradle
            ~/.cargo/registry
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6 libstdc++6 libgtk-3-0 libnss3 libsecret-1-0 libsqlite3-0 \
            libcurl4 libjsoncpp25 libayatana-appindicator3-1 libayatana-appindicator3-dev \
            libsqlite3-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev \
            cmake ninja-build clang pkg-config

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  # ── Unit + widget tests ───────────────────────────────────────────
  unit:
    name: unit-${{ matrix.os }}
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: ${{ env.RUST_TOOLCHAIN_PROFILE }}
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            ~/.gradle
            ~/.cargo/registry
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Linux test deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6 libstdc++6 libgtk-3-0 libnss3 libsecret-1-0 libsqlite3-0 \
            libcurl4 libjsoncpp25 libayatana-appindicator3-1 libayatana-appindicator3-dev \
            libsqlite3-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter test test/unit/ test/widget/ --reporter=expanded

  # ── Integration (E2E with mock Matrix client) ─────────────────────
  integration:
    name: integration-${{ matrix.os }}
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: ${{ env.RUST_TOOLCHAIN_PROFILE }}
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            ~/.gradle
            ~/.cargo/registry
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Linux integration deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6 libstdc++6 libgtk-3-0 libnss3 libsecret-1-0 libsqlite3-0 \
            libcurl4 libjsoncpp25 libayatana-appindicator3-1 libayatana-appindicator3-dev \
            libsqlite3-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev \
            cmake ninja-build clang pkg-config xvfb libgtk-3-dev

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Integration tests (Linux desktop)
        if: runner.os == 'Linux'
        run: |
          set +e
          exit_code=0
          for test_file in integration_test/*.dart; do
            echo "::group::Running $test_file"
            xvfb-run -a flutter test "$test_file" -d linux --device-timeout 60
            if [ $? -ne 0 ]; then
              echo "::error::$test_file FAILED"
              exit_code=1
            fi
            echo "::endgroup::"
          done
          exit $exit_code
        # Note: Integration tests require a real desktop session.
        # On Windows runners the debug VM service can't attach reliably,
        # so integration tests are run manually by contributors — see CONTRIBUTING.md.

  # ── Build smoke tests (release bundles) ───────────────────────────
  build-linux:
    name: build-linux
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: ${{ env.RUST_TOOLCHAIN_PROFILE }}
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            ~/.cargo/registry
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6 libstdc++6 libgtk-3-0 libnss3 libsecret-1-0 libsqlite3-0 \
            libcurl4 libjsoncpp25 libayatana-appindicator3-1 \
            libsqlite3-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev \
            cmake ninja-build clang pkg-config

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build linux --release

      - name: Upload linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  build-windows:
    name: build-windows
    needs: [unit, integration]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: ${{ env.RUST_TOOLCHAIN_PROFILE }}
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            ~/.cargo/registry
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build windows --release

      - name: Upload windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: build/windows/x64/runner/Release
          if-no-files-found: error
