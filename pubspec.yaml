name: azhi_main
description: "The FOSS Matrix client with a focus on professional usage."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 0.2.0+1

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fluent_ui: any
  fluentui_system_icons: ^1.1.252
  matrix: ^0.31.0
  provider: ^6.1.2
  path_provider: ^2.1.2
  logger: ^2.2.0
  flutter_spinkit: ^5.2.1
  persian_fonts: ^1.0.5
  flutter_svg: ^2.0.10+1
  system_theme: any
  window_manager: any
  flutter_acrylic: ^1.1.3
  badges: ^3.1.2
  flutter_olm: ^1.4.1
  flutter_openssl_crypto: ^0.3.0
  go_router: ^14.2.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  blurrycontainer: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/ttf/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/ttf/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/ttf/JetBrainsMono-Italic.ttf
          style: italic

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/fonts/
    - assets/gpl-3.0.txt
