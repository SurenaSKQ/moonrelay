name: azhi_main
description: "The FOSS Matrix client with a focus on professional usage."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fluent_ui: ^4.4.0
  matrix: ^0.25.12
  provider: ^6.1.2
  path_provider: ^2.1.2
  logger: ^2.2.0
  flutter_spinkit: ^5.2.1
  persian_fonts: ^1.0.5
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/fonts/
