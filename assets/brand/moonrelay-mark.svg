  The Moonrelay mark. Line only: no fill, one stroke weight, round caps.

  The crescent is two arcs of one path, not a circle and a mask. An outer
  circle of r=24 centred at (34,32), and the inner boundary is the right limb
  of a r=20 circle centred at (18,32). The two intersect at x=31.5, y=17.25
  and y=46.75, so subtracting the second from the first leaves a crescent
  whose body is on the right and whose opening faces left.

  The two arcs are the relay: semicircles of r=13 and r=7 centred at (17,32),
  which is the classic broadcast mark. They sit in the crescent's opening with
  8 units of clearance, so at any size the two never touch.

  Why two arcs and not three: at a 16px favicon a third ring closes up into a
  smudge, and the mark has to survive being 16px. Why a crescent rather than a
  full disc: a disc with craters is a drawing of the Moon, and a crescent with
  a signal is a mark.

  Colour is left as currentColor so one file serves both themes. In the app it
  is drawn through SvgPicture with a colourFilter, so it takes the ramp's
  onSurface rather than a brand colour that would not match either theme.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  fill="none"
  stroke="currentColor"
  stroke-width="2.5"
  stroke-linecap="round"
  stroke-linejoin="round"
  role="img"
  aria-label="Moonrelay"
>
  <path d="M31.5 17.25A24 24 0 1 1 31.5 46.75A20 20 0 0 0 31.5 17.25" />
  <path d="M4 32a13 13 0 0 1 26 0" />
  <path d="M10 32a7 7 0 0 1 14 0" />
</svg>