name: moonrelay
description: "a Matrix client with a focus on professional usage."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 0.3.0+0

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  matrix: ^7.2.3
  provider: ^6.1.2
  path_provider: ^2.1.2
  logger: ^2.2.0
  flutter_svg: ^2.0.10+1
  system_theme: any
  window_manager: any
  flutter_acrylic: ^1.1.3
  go_router: ^17.3.0
  intl: any
  google_fonts: ^8.1.0
  future_loading_dialog: ^0.3.0
  linkify_text: ^0.0.9
  shared_preferences: ^2.5.3
  scroll_to_index: ^3.0.1
  cross_file: ^0.3.4+2
  file_picker: ^11.0.2
  sqflite: ^2.4.2
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.6.0+eol
  sqflite_common_ffi: ^2.3.5
  lucide_icons_flutter: ^3.0.4
  flutter_vodozemac: ^0.5.0
  url_launcher: ^6.3.2
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ttf/IBMPlexSansArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/ttf/IBMPlexSansArabic-ExtraLight.ttf
        - asset: assets/fonts/ttf/IBMPlexSansArabic-Light.ttf
        - asset: assets/fonts/ttf/IBMPlexSansArabic-Medium.ttf
        - asset: assets/fonts/ttf/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/ttf/IBMPlexSansArabic-SemiBold.ttf
        - asset: assets/fonts/ttf/IBMPlexSansArabic-Thin.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/ttf/SpaceMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/ttf/SpaceMono-BoldItalic.ttf
          style: italic
        - asset: assets/fonts/ttf/SpaceMono-Italic.ttf
        - asset: assets/fonts/ttf/SpaceMono-Regular.ttf

    - family: Rubik
      fonts:
        - asset: assets/fonts/variable/Rubik-Italic-VariableFont_wght.ttf
          style: italic
        - asset: assets/fonts/variable/Rubik-VariableFont_wght.ttf
    - family: FiraCode
      fonts:
        - asset: assets/fonts/variable/FiraCode-VF.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/variable/JetBrainsMono-Italic[wght].ttf
          style: italic
        - asset: assets/fonts/variable/JetBrainsMono[wght].ttf
    - family: Oxanium
      fonts:
        - asset: assets/fonts/variable/Oxanium-VariableFont_wght.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/variable/SpaceGrotesk-VariableFont_wght.ttf

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/fonts/
    - assets/agpl-3.0.txt
    - assets/agpl-3.0.md
    - assets/gpl-3.0.txt
    - assets/gpl-3.0.md
